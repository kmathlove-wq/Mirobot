  <circle cx="27" cy="24.5" r="3.2" fill="#2d3142"/>
  <circle cx="37" cy="24.5" r="3.2" fill="#2d3142"/>
  <circle cx="28" cy="23.4" r="1" fill="#ffffff"/>
  <circle cx="38" cy="23.4" r="1" fill="#ffffff"/>
  <rect x="27" y="30" width="10" height="2.6" rx="1.3" fill="#2d3142"/>
</svg>
