  <!-- 로봇이 지나간 노란 길: 왼쪽 입구 → 로봇 아래 → 오른쪽 출구 -->
  <clipPath id="tile"><rect x="1" y="1" width="62" height="62" rx="15"/></clipPath>
  <path clip-path="url(#tile)" d="M0 42.5 H14 V50.5 H45 V33.5 H64" fill="none" stroke="#ffb800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
